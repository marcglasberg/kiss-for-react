name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} / React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [26]
        react: [18, 19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Use React ${{ matrix.react }}
        if: matrix.react == 18
        run: npm install --no-save react@18 react-test-renderer@18 @types/react@18 @types/react-test-renderer@18
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run lint
      - run: npm test
      - run: npm run build
